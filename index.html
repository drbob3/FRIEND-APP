<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangout Chat</title>
<meta name="description" content="A small chat room to talk with friends.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
  :root {
    --desktop: #008080;
    --face: #c0c0c0;
    --light: #ffffff;
    --mid: #dfdfdf;
    --shadow: #808080;
    --dark: #0a0a0a;
    --title-a: #000080;
    --title-b: #1084d0;
    --title-off-a: #808080;
    --title-off-b: #b5b5b5;
    --text: #000000;
    --log-bg: #ffffff;
    --sep: #808080;
    --err: #a00000;
    --link: #0000ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desktop);
    color: var(--text);
    font: 13px/1.35 Tahoma, "MS Sans Serif", Verdana, Geneva, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    overflow: hidden;
  }
  /* ---- classic bevels ---- */
  .raised {
    background: var(--face);
    border: 2px solid;
    border-color: var(--light) var(--dark) var(--dark) var(--light);
    box-shadow: inset -1px -1px var(--shadow), inset 1px 1px var(--mid);
  }
  .sunken {
    border: 2px solid;
    border-color: var(--shadow) var(--light) var(--light) var(--shadow);
    box-shadow: inset 1px 1px var(--dark);
  }
  /* ---- main window ---- */
  .window { display: flex; flex-direction: column; padding: 3px; }
  #main {
    width: 100%;
    max-width: 820px;
    height: calc(100dvh - 48px);
  }
  .titlebar {
    background: linear-gradient(90deg, var(--title-a), var(--title-b));
    color: #fff;
    font-weight: bold;
    padding: 3px 3px 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    user-select: none;
    touch-action: none;
  }
  .window.inactive > .titlebar { background: linear-gradient(90deg, var(--title-off-a), var(--title-off-b)); color: #dcdcdc; }
  .titlebar .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl {
    width: 18px; height: 16px; min-width: 0 !important;
    display: inline-flex; align-items: center; justify-content: center;
    color: #000; font: bold 11px/1 Tahoma, sans-serif;
    padding: 0 !important;
  }
  span.ctl { cursor: default; }
  .toolbar { display: flex; gap: 4px; padding: 5px 2px; flex-wrap: wrap; }
  button, a.btn {
    font: inherit;
    color: var(--text);
    min-width: 75px;
    padding: 4px 10px;
    cursor: pointer;
    background: var(--face);
    border: 2px solid;
    border-color: var(--light) var(--dark) var(--dark) var(--light);
    box-shadow: inset -1px -1px var(--shadow), inset 1px 1px var(--mid);
    border-radius: 0;
    text-decoration: none;
    display: inline-block;
    text-align: center;
  }
  button:active, a.btn:active {
    border-color: var(--dark) var(--light) var(--light) var(--dark);
    box-shadow: inset 1px 1px var(--shadow);
  }
  button:disabled { color: var(--shadow); text-shadow: 1px 1px var(--light); cursor: default; }
  button:focus-visible, a.btn:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .banner { display: none; color: var(--err); font-weight: bold; padding: 4px 4px 6px; }
  .banner.show { display: block; }
  /* ---- chat log ---- */
  #messages {
    flex: 1;
    overflow-y: auto;
    background: var(--log-bg);
    padding: 8px 10px;
    font: 14px/1.5 "Lucida Console", "Courier New", monospace;
  }
  .empty { color: var(--shadow); }
  .line { white-space: pre-wrap; overflow-wrap: anywhere; }
  .line .time { color: var(--shadow); }
  .line .who { font-weight: bold; }
  .line a { color: var(--link); }
  .line a.vid::before { content: "▶ "; }
  .attach { display: block; margin: 4px 0 4px 2ch; }
  .attach img {
    display: block;
    max-width: min(260px, 100%);
    max-height: 200px;
    cursor: pointer;
    background: #eee;
    border: 2px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow);
  }
  .attach .ph { color: var(--shadow); font-style: italic; }
  .attach button { font-family: Tahoma, sans-serif; font-size: 13px; }
  .sep {
    color: var(--sep);
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    font-size: 20px;
    line-height: 1;
    letter-spacing: 3px;
    margin: 10px 0;
    user-select: none;
  }
  /* ---- composer ---- */
  form.composer { display: flex; gap: 6px; padding: 6px 2px 4px; align-items: stretch; }
  form.composer button { min-width: 0; }
  textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    font: 14px/1.4 "Lucida Console", "Courier New", monospace;
    color: var(--text);
    background: #fff;
    padding: 4px 6px;
    max-height: 110px;
    border-radius: 0;
  }
  textarea:focus, input:focus { outline: none; }
  .statusbar { display: flex; gap: 3px; padding-top: 2px; }
  .statusbar > div {
    padding: 2px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid; border-color: var(--shadow) var(--light) var(--light) var(--shadow);
  }
  .statusbar .grow { flex: 1; }
  /* ---- floating windows ---- */
  .float {
    position: fixed;
    width: 560px;
    max-width: calc(100vw - 16px);
    max-height: calc(100dvh - 16px);
    z-index: 10;
  }
  .float.max { left: 0 !important; top: 0 !important; width: 100vw; max-width: none; height: 100dvh; max-height: none; }
  .float .content { padding: 6px 4px 4px; display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; flex: 1; }
  .player { background: #000; display: flex; align-items: center; justify-content: center; }
  .player iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
  .player video, .player img { max-width: 100%; max-height: 60dvh; display: block; }
  .float.max .player video, .float.max .player img { max-height: 75dvh; }
  .player .ph { color: #c0c0c0; padding: 40px 10px; font-family: "Lucida Console", monospace; }
  fieldset {
    border: 2px groove var(--light);
    margin: 0;
    padding: 6px 8px 8px;
  }
  legend { padding: 0 4px; }
  .info { width: 100%; border-collapse: collapse; }
  .info td { padding: 2px 4px; vertical-align: top; }
  .info td:first-child { white-space: nowrap; width: 1%; color: #333; }
  .info td:last-child { overflow-wrap: anywhere; }
  .info a { color: var(--link); }
  .wbuttons { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  /* ---- dialog ---- */
  .overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .25);
    z-index: 1000;
  }
  .overlay.show { display: flex; }
  .dialog { width: 100%; max-width: 340px; padding: 3px; }
  .dialog .body { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .dialog .row { display: flex; gap: 10px; align-items: flex-start; }
  .dialog .icon { font-size: 28px; line-height: 1; }
  .dialog input { font: inherit; color: var(--text); background: #fff; padding: 4px 6px; border-radius: 0; width: 100%; }
  .dialog .buttons { display: flex; justify-content: flex-end; gap: 6px; }
  .tip {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: #ffffe1; color: #000; border: 1px solid #000;
    padding: 4px 8px; font-size: 12px;
    display: none; z-index: 2000;
  }
  .tip.show { display: block; }
  @media (max-width: 600px) {
    body { padding: 0; }
    #main { height: 100dvh; max-width: none; border: none; box-shadow: none; }
    #messages { font-size: 13px; }
    .float { width: calc(100vw - 16px); }
    .toolbar button { min-width: 0; }
  }
</style>
</head>
<body>
<div class="window raised" id="main">
  <div class="titlebar">
    <span>💬</span>
    <span class="t" id="titleText">Hangout Chat</span>
    <span class="ctl raised" aria-hidden="true">_</span>
    <span class="ctl raised" aria-hidden="true">□</span>
    <span class="ctl raised" aria-hidden="true">×</span>
  </div>
  <div class="toolbar">
    <button id="inviteBtn">Invite friends...</button>
    <button id="nameBtn">Change name...</button>
  </div>
  <div class="banner" id="banner"></div>
  <div id="messages" class="sunken"></div>
  <form class="composer" id="composer">
    <button type="button" id="attachBtn" title="Send an image or video">📎</button>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <textarea id="input" class="sunken" rows="1" maxlength="500" placeholder="Type a message..."></textarea>
    <button id="sendBtn" type="submit"><u>S</u>end</button>
  </form>
  <div class="statusbar">
    <div id="statusConn">Connecting...</div>
    <div class="grow" id="roomLabel"></div>
    <div id="statusCount">0 msg</div>
  </div>
</div>

<div class="overlay" id="nameOverlay">
  <form class="dialog raised" id="nameForm">
    <div class="titlebar"><span class="t">Welcome</span></div>
    <div class="body">
      <div class="row">
        <div class="icon">👤</div>
        <div>Enter your name. Your friends will see it next to your messages.</div>
      </div>
      <input id="nameInput" class="sunken" maxlength="24" placeholder="Your name" autocomplete="nickname" required>
      <div class="buttons"><button type="submit">OK</button></div>
    </div>
  </form>
</div>
<div class="tip" id="toast"></div>

<script type="module">
/* =========================================================
   FIREBASE CONFIG
   While it says "PASTE_HERE", the page runs in "test mode":
   messages only go between tabs on this PC.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDB_9bLkuXAHstoUlhKsOVeJpX7TL3Jdy4",
  authDomain: "friend-app-cc816.firebaseapp.com",
  databaseURL: "https://friend-app-cc816-default-rtdb.firebaseio.com",
  projectId: "friend-app-cc816",
  storageBucket: "friend-app-cc816.firebasestorage.app",
  messagingSenderId: "819987678033",
  appId: "1:819987678033:web:562cb00765e0c4eeea8970"
};

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const COLORS = ["#000080", "#800000", "#008000", "#800080", "#008080", "#c00000", "#0000c0", "#806000"];
const MAX_LEN = 500;
const MAX_VIDEO = 15 * 1000 * 1000;   // 15 MB
const MAX_IMAGE = 5 * 1000 * 1000;    // 5 MB after compression
const CHUNK = 522240;                  // raw bytes per chunk (multiple of 3)

// ---------- room (from the link) ----------
function getRoom() {
  const m = location.hash.match(/room=([a-z0-9-]{3,40})/i);
  if (m) return m[1].toLowerCase();
  const id = Math.random().toString(36).slice(2, 8) + "-" + Math.random().toString(36).slice(2, 6);
  history.replaceState(null, "", "#room=" + id);
  return id;
}
const room = getRoom();
$("roomLabel").textContent = "Room: " + room;
$("titleText").textContent = "Hangout Chat - " + room;
window.addEventListener("hashchange", () => location.reload());

// ---------- name ----------
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch { return null; } }
let myName = store("chat-name") || "";
let myColor = store("chat-color") || COLORS[Math.floor(Math.random() * COLORS.length)];
store("chat-color", myColor);

function askName() {
  $("nameInput").value = myName;
  $("nameOverlay").classList.add("show");
  setTimeout(() => $("nameInput").focus(), 50);
}
$("nameForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const n = $("nameInput").value.trim().slice(0, 24);
  if (!n) return;
  myName = n;
  store("chat-name", n);
  $("nameOverlay").classList.remove("show");
  $("input").focus();
  render();
});
$("nameBtn").addEventListener("click", askName);
if (!myName) askName();

// ---------- invite ----------
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("show"), 2200);
}
$("inviteBtn").addEventListener("click", async () => {
  const link = location.href;
  if (navigator.share) {
    try { await navigator.share({ title: "Join my chat", url: link }); return; } catch {}
  }
  try { await navigator.clipboard.writeText(link); toast("Link copied! Paste it to your friends."); }
  catch { prompt("Copy this link and send it to your friends:", link); }
});

// ---------- helpers ----------
function fmtTime(ms) {
  if (!ms) return "--:--";
  const d = new Date(ms);
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], { day: "2-digit", month: "2-digit" }) + " " + t;
}
function fmtFull(ms) { return ms ? new Date(ms).toLocaleString() : "just now"; }
function fmtSize(n) {
  if (!n && n !== 0) return "?";
  if (n < 1024) return n + " bytes";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
function fmtDur(s) {
  if (!isFinite(s)) return "?";
  s = Math.round(s);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// ---------- link parsing ----------
const URL_RE = /https?:\/\/[^\s<>"]+/g;
function cleanUrl(u) { return u.replace(/[.,!?;:)\]]+$/, ""); }

function parseVideo(url) {
  let u;
  try { u = new URL(url); } catch { return null; }
  if (u.protocol !== "https:" && u.protocol !== "http:") return null;
  const host = u.hostname.replace(/^www\.|^m\./, "");
  let m;
  if (host === "youtube.com" || host === "music.youtube.com") {
    let id = u.searchParams.get("v");
    if (!id && (m = u.pathname.match(/^\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/))) id = m[1];
    if (id && /^[A-Za-z0-9_-]{11}$/.test(id)) return { kind: "youtube", id, url, start: parseStart(u) };
  }
  if (host === "youtu.be" && (m = u.pathname.match(/^\/([A-Za-z0-9_-]{11})/))) return { kind: "youtube", id: m[1], url, start: parseStart(u) };
  if (host === "vimeo.com" && (m = u.pathname.match(/^\/(\d+)/))) return { kind: "vimeo", id: m[1], url };
  if (host === "dailymotion.com" && (m = u.pathname.match(/^\/video\/([A-Za-z0-9]+)/))) return { kind: "dailymotion", id: m[1], url };
  if (host === "dai.ly" && (m = u.pathname.match(/^\/([A-Za-z0-9]+)/))) return { kind: "dailymotion", id: m[1], url };
  if (/\.(mp4|webm|ogv|mov)$/i.test(u.pathname)) return { kind: "file", url: u.href, fname: decodeURIComponent(u.pathname.split("/").pop()) };
  return null;
}
function parseStart(u) {
  const t = u.searchParams.get("t") || u.searchParams.get("start");
  if (!t) return 0;
  const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
  if (!m) return 0;
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
function isImageUrl(url) { try { const u = new URL(url); return /^https?:$/.test(u.protocol) && /\.(png|jpe?g|gif|webp)$/i.test(u.pathname); } catch { return false; } }

// fills a container with text where links become clickable
function appendRichText(parent, text, msg) {
  let last = 0;
  for (const match of text.matchAll(URL_RE)) {
    const url = cleanUrl(match[0]);
    parent.append(text.slice(last, match.index));
    const a = el("a", null, url);
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const vid = parseVideo(url);
    if (vid) {
      a.className = "vid";
      a.title = "Watch in a window";
      a.addEventListener("click", (e) => { if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); openVideoLink(vid, msg); });
    } else if (isImageUrl(url)) {
      a.addEventListener("click", (e) => { if (e.ctrlKey || e.metaKey || e.shiftKey) return; e.preventDefault(); openImageWindow({ src: url, title: url.split("/").pop(), msg, external: url }); });
    }
    parent.append(a);
    last = match.index + match[0].length - (match[0].length - url.length);
  }
  parent.append(text.slice(last));
}

// ---------- floating windows ----------
let zTop = 10;
let cascade = 0;
function focusWindow(w) {
  w.style.zIndex = ++zTop;
  document.querySelectorAll(".float").forEach((x) => x.classList.toggle("inactive", x !== w));
}
function openWindow(title, icon) {
  const w = el("div", "window raised float");
  const bar = el("div", "titlebar");
  const t = el("span", "t", title);
  const bMax = el("button", "ctl", "□"); bMax.title = "Maximize"; bMax.type = "button";
  const bClose = el("button", "ctl", "×"); bClose.title = "Close"; bClose.type = "button";
  bar.append(el("span", null, icon || "🪟"), t, bMax, bClose);
  const content = el("div", "content");
  w.append(bar, content);
  document.body.append(w);

  // place it, cascading
  const small = innerWidth <= 600;
  const x = small ? 8 : Math.max(8, Math.min(innerWidth - w.offsetWidth - 8, 60 + cascade * 28));
  const y = small ? 40 + (cascade % 4) * 20 : Math.max(8, 40 + cascade * 28);
  cascade = (cascade + 1) % 6;
  w.style.left = x + "px";
  w.style.top = y + "px";
  focusWindow(w);

  w.addEventListener("pointerdown", () => focusWindow(w));
  bClose.addEventListener("click", () => { w.remove(); });
  bMax.addEventListener("click", () => { w.classList.toggle("max"); bMax.textContent = w.classList.contains("max") ? "❐" : "□"; });
  bar.addEventListener("dblclick", (e) => { if (e.target === bar || e.target === t) bMax.click(); });

  // dragging (mouse + touch)
  bar.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || w.classList.contains("max")) return;
    const r = w.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    const move = (ev) => {
      const nx = Math.min(Math.max(ev.clientX - dx, -r.width + 80), innerWidth - 80);
      const ny = Math.min(Math.max(ev.clientY - dy, 0), innerHeight - 30);
      w.style.left = nx + "px";
      w.style.top = ny + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
    bar.addEventListener("pointercancel", up);
  });
  return { w, content, setTitle: (s) => { t.textContent = s; } };
}

function infoTable(rows) {
  const tbl = el("table", "info");
  const refs = {};
  for (const [label, value, key] of rows) {
    const tr = el("tr");
    const v = el("td");
    if (value instanceof Node) v.append(value); else v.textContent = value ?? "";
    if (key) refs[key] = v;
    tr.append(el("td", null, label + ":"), v);
    tbl.append(tr);
  }
  return { tbl, refs };
}
function linkNode(url, text) {
  const a = el("a", null, text || url);
  a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
function sharedBy(msg) { return msg ? msg.name + "  (" + fmtFull(msg.ts) + ")" : "?"; }

const SITE_NAMES = { youtube: "YouTube", vimeo: "Vimeo", dailymotion: "Dailymotion", file: "Video file" };

function openVideoLink(v, msg) {
  const { w, content, setTitle } = openWindow("Video Player - loading...", "▶");
  const player = el("div", "player");
  if (v.kind === "file") {
    const video = el("video");
    video.controls = true; video.autoplay = true; video.src = v.url;
    player.append(video);
    video.addEventListener("loadedmetadata", () => {
      refs.res.textContent = video.videoWidth + " x " + video.videoHeight;
      refs.dur.textContent = fmtDur(video.duration);
    });
    video.addEventListener("error", () => player.replaceChildren(el("div", "ph", "This video can't be played here. Try \"Open original\".")));
  } else {
    const iframe = el("iframe");
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    if (v.kind === "youtube") iframe.src = "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1" + (v.start ? "&start=" + v.start : "");
    if (v.kind === "vimeo") iframe.src = "https://player.vimeo.com/video/" + v.id + "?autoplay=1";
    if (v.kind === "dailymotion") iframe.src = "https://www.dailymotion.com/embed/video/" + v.id + "?autoplay=1";
    player.append(iframe);
  }
  const rows = [
    ["Title", "loading...", "title"],
    ["Channel", "...", "author"],
    ["Site", SITE_NAMES[v.kind]],
  ];
  if (v.kind === "file") rows.splice(1, 1, ["Resolution", "...", "res"], ["Duration", "...", "dur"]);
  rows.push(["Link", linkNode(v.url)], ["Shared by", sharedBy(msg)]);
  const { tbl, refs } = infoTable(rows);
  const fs = el("fieldset"); fs.append(el("legend", null, "Video information"), tbl);
  const btns = el("div", "wbuttons");
  const open = el("a", "btn", "Open original"); open.href = v.url; open.target = "_blank"; open.rel = "noopener noreferrer";
  const close = el("button", null, "Close"); close.addEventListener("click", () => w.remove());
  btns.append(open, close);
  content.append(player, fs, btns);

  if (v.kind === "file") {
    refs.title.textContent = v.fname || "video";
    setTitle(v.fname + " - Video Player");
  } else {
    fetch("https://noembed.com/embed?url=" + encodeURIComponent(v.url))
      .then((r) => r.json())
      .then((d) => {
        if (d.error) throw new Error(d.error);
        refs.title.textContent = d.title || "(no title)";
        if (refs.author) {
          if (d.author_url) refs.author.replaceChildren(linkNode(d.author_url, d.author_name || d.author_url));
          else refs.author.textContent = d.author_name || "?";
        }
        setTitle((d.title || "Video") + " - Video Player");
      })
      .catch(() => {
        refs.title.textContent = "(info not available)";
        if (refs.author) refs.author.textContent = "?";
        setTitle(SITE_NAMES[v.kind] + " - Video Player");
      });
  }
}

function openImageWindow({ src, title, msg, info = [], external, download }) {
  const { w, content } = openWindow(title + " - Image Viewer", "🖼");
  const player = el("div", "player");
  const img = el("img");
  img.alt = title;
  img.src = src;
  player.append(img);
  const { tbl, refs } = infoTable([["File", title], ["Resolution", "...", "res"], ...info, ["Shared by", sharedBy(msg)]]);
  img.addEventListener("load", () => { refs.res.textContent = img.naturalWidth + " x " + img.naturalHeight; });
  img.addEventListener("error", () => { player.replaceChildren(el("div", "ph", "This image can't be loaded.")); });
  const fs = el("fieldset"); fs.append(el("legend", null, "Image information"), tbl);
  const btns = el("div", "wbuttons");
  if (external) { const a = el("a", "btn", "Open original"); a.href = external; a.target = "_blank"; a.rel = "noopener noreferrer"; btns.append(a); }
  if (download) { const a = el("a", "btn", "Save..."); a.href = src; a.download = download; btns.append(a); }
  const close = el("button", null, "Close"); close.addEventListener("click", () => w.remove());
  btns.append(close);
  content.append(player, fs, btns);
}

function openUploadedVideo(media, msg) {
  const { w, content } = openWindow((media.fname || "video") + " - Video Player", "▶");
  const player = el("div", "player");
  player.append(el("div", "ph", "Loading video... (" + fmtSize(media.size) + ")"));
  const { tbl, refs } = infoTable([
    ["File", media.fname || "video"],
    ["Size", fmtSize(media.size)],
    ["Type", media.mime || "?"],
    ["Resolution", "...", "res"],
    ["Duration", "...", "dur"],
    ["Shared by", sharedBy(msg)],
  ]);
  const fs = el("fieldset"); fs.append(el("legend", null, "Video information"), tbl);
  const btns = el("div", "wbuttons");
  const save = el("a", "btn", "Save..."); save.style.display = "none";
  const close = el("button", null, "Close"); close.addEventListener("click", () => w.remove());
  btns.append(save, close);
  content.append(player, fs, btns);
  loadMedia(media).then((url) => {
    const video = el("video");
    video.controls = true; video.autoplay = true; video.playsInline = true; video.src = url;
    video.addEventListener("loadedmetadata", () => {
      refs.res.textContent = video.videoWidth + " x " + video.videoHeight;
      refs.dur.textContent = fmtDur(video.duration);
    });
    video.addEventListener("error", () => player.replaceChildren(el("div", "ph", "Your browser can't play this video format. Use \"Save...\" to download it.")));
    player.replaceChildren(video);
    save.href = url; save.download = media.fname || "video"; save.style.display = "";
  }).catch((e) => player.replaceChildren(el("div", "ph", "Can't load this video: " + e.message)));
}

// ---------- rendering ----------
let messages = [];
let sentJustNow = false;
const SEP = "- ".repeat(150);

function renderAttachment(m) {
  const box = el("div", "attach");
  const media = m.media;
  if (media.kind === "image") {
    const img = el("img");
    img.alt = media.fname || "image";
    img.title = "Click to open";
    const cached = mediaUrls.get(media.id);
    if (cached) img.src = cached;
    else {
      img.style.minWidth = "120px"; img.style.minHeight = "80px";
      loadMedia(media).then((u) => { img.src = u; img.style.minWidth = img.style.minHeight = ""; }).catch(() => box.replaceChildren(el("span", "ph", "[image not available]")));
    }
    img.addEventListener("click", () => loadMedia(media).then((u) => openImageWindow({
      src: u, title: media.fname || "image", msg: m,
      info: [["Size", fmtSize(media.size)], ["Type", media.mime || "?"]],
      download: media.fname || "image.jpg",
    })));
    box.append(img);
  } else {
    const b = el("button", null, "▶ " + (media.fname || "video") + "  (" + fmtSize(media.size) + ")");
    b.title = "Watch in a window";
    b.addEventListener("click", () => openUploadedVideo(media, m));
    box.append(b);
  }
  return box;
}

function render() {
  const box = $("messages");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.replaceChildren();
  $("statusCount").textContent = messages.length + " msg";
  if (!messages.length) {
    box.append(el("div", "empty", '*** No messages yet. Say hi, then click "Invite friends..." and send the link.'));
    return;
  }
  let prevKey = null;
  for (const m of messages) {
    const key = m.name + "|" + m.color;
    if (prevKey !== null && key !== prevKey) box.append(el("div", "sep", SEP));
    const line = el("div", "line");
    const who = el("span", "who", m.name + ": ");
    who.style.color = m.color || "#000";
    const text = el("span");
    appendRichText(text, m.text || "", m);   // safe: text nodes + checked links only
    line.append(el("span", "time", "[" + fmtTime(m.ts) + "] "), who, text);
    if (m.media) line.append(renderAttachment(m));
    box.append(line);
    prevKey = key;
  }
  if (nearBottom || sentJustNow) { box.scrollTop = box.scrollHeight; sentJustNow = false; }
}

function showBanner(text) { const b = $("banner"); b.textContent = "⚠ " + text; b.classList.add("show"); }
function setStatus(t) { $("statusConn").textContent = t; }

// ---------- media storage (files are split in pieces in the database) ----------
const mediaUrls = new Map();      // id -> object URL
const mediaLoading = new Map();   // id -> promise
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
function loadMedia(media) {
  if (mediaUrls.has(media.id)) return Promise.resolve(mediaUrls.get(media.id));
  if (!mediaLoading.has(media.id)) {
    const p = backend.fetchChunks(media).then((chunks) => {
      const blob = new Blob(chunks.map(b64ToBytes), { type: media.mime || "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      mediaUrls.set(media.id, url);
      return url;
    });
    p.catch(() => mediaLoading.delete(media.id));
    mediaLoading.set(media.id, p);
  }
  return mediaLoading.get(media.id);
}

async function compressImage(file) {
  if (file.type === "image/gif" || file.type === "image/svg+xml") return { blob: file, mime: file.type };
  try {
    const bmp = await createImageBitmap(file);
    const maxSide = 1600;
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    for (const q of [0.85, 0.7, 0.55]) {
      const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
      if (blob && (blob.size <= 1500000 || q === 0.55)) return { blob, mime: "image/jpeg" };
    }
  } catch {}
  return { blob: file, mime: file.type || "image/jpeg" };
}

async function sendFile(file) {
  if (!myName) { askName(); return; }
  const isImg = file.type.startsWith("image/");
  const isVid = file.type.startsWith("video/");
  if (!isImg && !isVid) { showBanner("Only images and videos can be sent."); return; }
  let blob = file, mime = file.type;
  if (isImg) ({ blob, mime } = await compressImage(file));
  const limit = isImg ? MAX_IMAGE : MAX_VIDEO;
  if (blob.size > limit) {
    showBanner((isImg ? "Image" : "Video") + " too big: " + fmtSize(blob.size) + ". Max is " + fmtSize(limit) + ".");
    return;
  }
  let fname = (file.name || (isImg ? "image" : "video")).slice(0, 80);
  if (isImg && mime === "image/jpeg" && !/\.jpe?g$/i.test(fname)) fname = fname.replace(/\.[^.]+$/, "") + ".jpg";
  const count = Math.max(1, Math.ceil(blob.size / CHUNK));
  const caption = $("input").value.trim().slice(0, MAX_LEN);
  $("attachBtn").disabled = true;
  try {
    const id = backend.newMediaId();
    for (let i = 0; i < count; i++) {
      setStatus("Uploading " + Math.round((i / count) * 100) + "%");
      const b64 = await blobToB64(blob.slice(i * CHUNK, (i + 1) * CHUNK));
      await backend.putChunk(id, i, b64);
    }
    const media = { id, kind: isImg ? "image" : "video", mime: mime.slice(0, 60), size: blob.size, chunks: count, fname };
    mediaUrls.set(id, URL.createObjectURL(blob));
    sentJustNow = true;
    await backend.send(caption, media);
    $("input").value = "";
    toast((isImg ? "Image" : "Video") + " sent!");
  } catch (err) {
    showBanner("Upload failed: " + err.message);
  } finally {
    $("attachBtn").disabled = false;
    setStatus(backend.online ? "● Online" : "Test mode");
  }
}

$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) sendFile(f);
});
document.addEventListener("paste", (e) => {
  const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); sendFile(f); }
});
$("main").addEventListener("dragover", (e) => e.preventDefault());
$("main").addEventListener("drop", (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (f) { e.preventDefault(); sendFile(f); }
});

// ---------- backend ----------
const configured = !Object.values(firebaseConfig).includes("PASTE_HERE");
let backend;

if (configured) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const rtdb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const db = rtdb.getDatabase(initializeApp(firebaseConfig));
  const roomRef = rtdb.ref(db, "rooms/" + room);
  const q = rtdb.query(roomRef, rtdb.orderByChild("ts"), rtdb.limitToLast(200));
  rtdb.onValue(rtdb.ref(db, ".info/connected"), (s) => { backend.online = !!s.val(); setStatus(s.val() ? "● Online" : "○ Offline"); });
  rtdb.onValue(q, (snap) => {
    const list = [];
    snap.forEach((c) => {
      const x = c.val();
      list.push({ name: x.name, color: x.color, text: x.text, ts: x.ts || 0, media: x.media || null });
    });
    messages = list;
    render();
  }, (err) => {
    setStatus("○ Offline");
    showBanner("Can't load messages: " + err.message);
  });
  backend = {
    online: false,
    newMediaId: () => rtdb.push(rtdb.ref(db, "media/" + room)).key,
    putChunk: (id, i, b64) => rtdb.set(rtdb.ref(db, "media/" + room + "/" + id + "/chunks/" + i), b64),
    fetchChunks: async (media) => {
      const snap = await rtdb.get(rtdb.ref(db, "media/" + room + "/" + media.id + "/chunks"));
      const v = snap.val();
      if (!v) throw new Error("file not found");
      const arr = Array.isArray(v) ? v : Object.keys(v).sort((a, b) => a - b).map((k) => v[k]);
      if (arr.length < media.chunks) throw new Error("file incomplete");
      return arr.slice(0, media.chunks);
    },
    send: (text, media) => {
      const msg = { name: myName, color: myColor, text, ts: rtdb.serverTimestamp() };
      if (media) msg.media = media;
      return rtdb.push(roomRef, msg);
    },
  };
} else {
  setStatus("Test mode");
  showBanner("Test mode: Firebase isn't set up yet, so messages only reach other tabs on this computer.");
  const key = "chat-local-" + room;
  let ch = null;
  try { ch = new BroadcastChannel(key); } catch {}
  try { messages = JSON.parse(store(key) || "[]"); } catch { messages = []; }
  const localChunks = new Map();
  if (ch) ch.onmessage = (e) => { messages = e.data; render(); };
  backend = {
    online: false,
    newMediaId: () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    putChunk: async (id, i, b64) => { if (!localChunks.has(id)) localChunks.set(id, []); localChunks.get(id)[i] = b64; },
    fetchChunks: async (media) => { const c = localChunks.get(media.id); if (!c) throw new Error("only on the PC that sent it (test mode)"); return c; },
    send: async (text, media) => {
      const msg = { name: myName, color: myColor, text, ts: Date.now() };
      if (media) msg.media = media;
      messages = [...messages, msg].slice(-200);
      store(key, JSON.stringify(messages));
      ch?.postMessage(messages);
      render();
    },
  };
  render();
}

// ---------- composer ----------
const input = $("input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 110) + "px"; });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
let lastSend = 0;
$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim().slice(0, MAX_LEN);
  if (!text) return;
  if (!myName) { askName(); return; }
  if (Date.now() - lastSend < 700) return;   // small anti-spam
  lastSend = Date.now();
  input.value = "";
  input.style.height = "auto";
  sentJustNow = true;
  try { await backend.send(text, null); }
  catch (err) { input.value = text; showBanner("Message not sent: " + err.message); }
});
</script>
